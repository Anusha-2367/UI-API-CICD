
name: Key Vault Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-keyvault:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read deployment version from Key Vault
        run: |
          VERSION=$(az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "deployment-version" \
            --query value \
            --output tsv)

          echo "::add-mask::$VERSION"
          echo "Key Vault access successful."
          echo "Current deployment version: $VERSION"
```
