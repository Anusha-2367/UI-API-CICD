name: UI-API-CICD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ========================================
  # Stage 0: Detect Changes
  # ========================================
  detect-changes:
    name: Detect UI/API Changes
    runs-on: ubuntu-latest

    outputs:
      ui_changed: ${{ steps.changes.outputs.ui }}
      api_changed: ${{ steps.changes.outputs.api }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'UI/**'
            api:
              - 'API/**'


  # ========================================
  # Stage 1: Build UI
  # ========================================
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Install UI dependencies
        working-directory: UI
        run: npm ci

      - name: Build UI
        working-directory: UI
        run: npm run build

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: UI/dist


  # ========================================
  # Stage 2: Build API
  # ========================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build API
        working-directory: API
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: API/target/*.jar


  # ========================================
  # Stage 3: Deploy UI
  # ========================================
  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest
    needs: build-ui
    if: needs.build-ui.result == 'success'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: UI/dist

      - name: Verify UI files
        run: |
          echo "Downloaded UI files:"
          ls -la UI/dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UI to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ui-appservice
          package: UI/dist


  # ========================================
  # Stage 4: Deploy API
  # ========================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build-api
    if: needs.build-api.result == 'success'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: API/target

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-appservice
          package: API/target/*.jar
