name: UI-API-CICD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Install UI dependencies
        working-directory: UI
        run: npm ci

      - name: Build UI
        working-directory: UI
        run: npm run build