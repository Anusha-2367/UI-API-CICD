```yaml
name: UI-API-CICD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Enter existing deployment tag, example: dev-1.0.0"
        required: true
        type: string

# Prevent two deployments from calculating the same version.
concurrency:
  group: ui-api-deployment
  cancel-in-progress: false


# ============================================================
# JOB 1: DETECT UI / API CHANGES
# ============================================================

jobs:

  detect-changes:
    name: Detect UI/API Changes
    runs-on: ubuntu-latest

    outputs:
      ui_changed: ${{ steps.final.outputs.ui }}
      api_changed: ${{ steps.final.outputs.api }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_tag || github.sha }}

      # --------------------------------------------------------
      # Manual tag deployment
      # When a tag is selected, build both UI and API.
      # --------------------------------------------------------

      - name: Manual tag deployment
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          echo "ui=true" >> "$GITHUB_OUTPUT"
          echo "api=true" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Automatic deployment from main
      # Detect which folder changed.
      # --------------------------------------------------------

      - name: Detect changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'UI/**'
            api:
              - 'API/**'

      # --------------------------------------------------------
      # Set final outputs
      # --------------------------------------------------------

      - name: Set final outputs
        id: final
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "ui=${{ steps.manual.outputs.ui }}" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.manual.outputs.api }}" >> "$GITHUB_OUTPUT"

          else

            echo "ui=${{ steps.filter.outputs.ui }}" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # JOB 2: PREPARE VERSION
  # ============================================================

  prepare-version:
    name: Prepare Deployment Version
    runs-on: ubuntu-latest

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.ui_changed == 'true' ||
      needs.detect-changes.outputs.api_changed == 'true'

    outputs:
      version: ${{ steps.final-version.outputs.version }}

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # MANUAL TAG
      #
      # Example:
      # dev-1.0.0
      #
      # We use the version from the tag.
      # We DO NOT create another tag.
      # --------------------------------------------------------

      - name: Use manual deployment tag
        if: github.event_name == 'workflow_dispatch'
        id: manual_version
        run: |

          TAG="${{ inputs.deploy_tag }}"

          if [[ ! "$TAG" =~ ^dev-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format."
            echo "Expected format: dev-X.Y.Z"
            exit 1
          fi

          VERSION="${TAG#dev-}"

          echo "Selected tag: $TAG"
          echo "Deployment version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # AUTOMATIC MAIN DEPLOYMENT
      #
      # Read current version from Azure Key Vault.
      # Example:
      #
      # Key Vault = 1.0.0
      # Next       = 1.0.1
      # --------------------------------------------------------

      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Read and calculate next version
        if: github.event_name == 'push'
        id: automatic_version
        run: |

          CURRENT_VERSION=$(az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "deployment-version" \
            --query value \
            --output tsv)

          echo "Current version from Key Vault: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          NEXT_PATCH=$((PATCH + 1))

          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH"

          echo "Next deployment version: $NEXT_VERSION"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # FINAL VERSION OUTPUT
      # --------------------------------------------------------

      - name: Set final version
        id: final-version
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "version=${{ steps.manual_version.outputs.version }}" >> "$GITHUB_OUTPUT"

          else

            echo "version=${{ steps.automatic_version.outputs.version }}" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # JOB 3: BUILD UI
  # ============================================================

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - prepare-version

    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Install UI dependencies
        working-directory: UI
        run: npm ci

      - name: Build UI
        working-directory: UI
        run: npm run build

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: UI/dist


  # ============================================================
  # JOB 4: BUILD API
  # ============================================================

  build-api:
    name: Build API
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - prepare-version

    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_tag || github.sha }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build API
        working-directory: API
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: API/target/*.jar


  # ============================================================
  # JOB 5: DEPLOY UI
  # ============================================================

  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest

    needs: build-ui

    if: needs.build-ui.result == 'success'

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: UI/dist

      - name: Verify UI files
        run: |
          echo "Downloaded UI files:"
          ls -la UI/dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UI to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ui-appservice
          package: UI/dist


  # ============================================================
  # JOB 6: DEPLOY API
  # ============================================================

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest

    needs: build-api

    if: needs.build-api.result == 'success'

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download API build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: API/target

      - name: Verify API files
        run: |
          echo "Downloaded API files:"
          ls -la API/target

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-appservice
          package: API/target/*.jar


  # ============================================================
  # JOB 7: FINALIZE DEPLOYMENT
  #
  # This runs ONLY for automatic main deployments.
  #
  # After successful deployment:
  #
  # 1. Update Key Vault version
  # 2. Create dev-X.Y.Z tag
  # 3. Push tag to GitHub
  #
  # Manual tag deployment does not create a new tag.
  # ============================================================

  finalize-deployment:
    name: Finalize Deployment
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - prepare-version
      - build-ui
      - build-api
      - deploy-ui
      - deploy-api

    if: |
      always() &&
      github.event_name == 'push' &&
      needs.detect-changes.result == 'success' &&
      needs.prepare-version.result == 'success' &&
      (
        needs.detect-changes.outputs.ui_changed == 'true' ||
        needs.detect-changes.outputs.api_changed == 'true'
      ) &&
      (
        needs.build-ui.result == 'success' ||
        needs.build-ui.result == 'skipped'
      ) &&
      (
        needs.build-api.result == 'success' ||
        needs.build-api.result == 'skipped'
      ) &&
      (
        needs.deploy-ui.result == 'success' ||
        needs.deploy-ui.result == 'skipped'
      ) &&
      (
        needs.deploy-api.result == 'success' ||
        needs.deploy-api.result == 'skipped'
      )

    permissions:
      contents: write
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Update Key Vault
      # --------------------------------------------------------

      - name: Update deployment version in Key Vault
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |

          echo "Updating Key Vault version..."

          az keyvault secret set \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "deployment-version" \
            --value "$VERSION" \
            --output none

          echo "Key Vault updated successfully."


      # --------------------------------------------------------
      # Create Git tag
      # --------------------------------------------------------

      - name: Create deployment tag
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |

          TAG="dev-$VERSION"

          echo "Creating deployment tag: $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"

          git push origin "$TAG"

          echo "Deployment tag created successfully: $TAG"
```
